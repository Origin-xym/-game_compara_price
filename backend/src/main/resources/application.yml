server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: game-price-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/game_compara_price?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: gameprice-2026-hs256-secret-key-please-change-me-0123456789

    expire-minutes: 120
  exchange:
    provider: placeholder        # P-3 定了再改
    api-key: ""
    refresh-cron: "0 30 9 * * ?"
  price:
    stale-hours: 24              # AC-4.4 / Q8 的"可能已过期"阈值，先定 24h
    cny-scale: 2                 # AC-4.5 / Q10b 小数精度
  alert:
    check-interval-ms: 60000      # 判定任务间隔，1 分钟（本地开发/验收用；生产可回 300000）
  collect:
      volatility-threshold: 0.5      # 采集价与当前价偏离 > 50% 视为剧烈波动，进待确认（AC-12.6）
      cron: "0 0 4 * * ?"            # 每天 04:00 全量采集
      mock-enabled: true             # 一期用模拟源验证链路，接真实 API 时置 false

logging:
  level:
    com.gameprice: debug
